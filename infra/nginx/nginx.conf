user  nginx;
worker_processes  auto;

events {
  worker_connections  1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;

  # Headers de seguranca basicos (docs/00-primeira-entrega.md, secao 15). TLS/HSTS ficam de fora
  # de proposito - terminacao TLS real (certbot, ou um load balancer/CDN na frente deste nginx)
  # e especifica do ambiente de deploy, nao algo que faz sentido fabricar aqui - ver
  # infra/nginx/README.md.
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  # /api/v1/... -> api:3000/api/v1/... (prefixo preservado, o Nest ja serve sob /api/v1 - decisao
  # de main.ts, app.setGlobalPrefix). /health e /ready ficam FORA do prefixo tambem no Nest, entao
  # roteados aqui separadamente para health checks de infraestrutura (load balancer etc.).
  upstream api_upstream {
    server api:3000;
  }

  upstream admin_upstream {
    server admin:3000;
  }

  server {
    listen 80;
    server_name _;

    location /api/ {
      proxy_pass http://api_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
      proxy_pass http://api_upstream/health;
    }

    location = /ready {
      proxy_pass http://api_upstream/ready;
    }

    # Painel admin/professor serve tudo mais (Next.js standalone).
    location / {
      proxy_pass http://admin_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    }
  }
}
