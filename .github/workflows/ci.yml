name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  NODE_VERSION: '20'

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npx tsc --noEmit -p apps/api/tsconfig.json
      - run: npx tsc --noEmit -p apps/admin/tsconfig.json
      - run: npx tsc --noEmit -p apps/mobile/tsconfig.json
      - run: npx tsc --noEmit -p packages/shared/tsconfig.json
      - run: npx tsc --noEmit -p packages/music-tools/tsconfig.json
      - run: npx tsc --noEmit -p tests/e2e/tsconfig.json
      - name: Lint apps/admin (flat config proprio do Next - decisao 42)
        working-directory: apps/admin
        run: npm run lint

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm test --workspace=apps/api
      - run: npm test --workspace=music-tools

  integration-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: edtech_musical_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/edtech_musical_test?schema=public
      NODE_ENV: test
      JWT_SECRET: ci-secret
      JWT_REFRESH_SECRET: ci-refresh-secret
      FAKE_PAYMENT_GATEWAY_SECRET: ci-secret
      FAKE_VIDEO_PROVIDER_SECRET: ci-secret
      FAKE_LIVE_PROVIDER_SECRET: ci-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy
        working-directory: apps/api
      - name: Testes de integracao (test/*.e2e-spec.ts - le DATABASE_URL do ambiente, nao de .env.test.local)
        working-directory: apps/api
        run: npx jest --config test/jest-e2e.json --runInBand
        env:
          # setup-env.ts tenta carregar .env.test.local (nao existe em CI) - variaveis reais ja
          # vem do `env:` do job acima, entao um dotenv "silencioso" (arquivo ausente) e esperado.
          CI: 'true'

  build-images:
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, unit-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build apps/api image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          tags: edtech-musical-api:ci
      - name: Build apps/admin image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/admin/Dockerfile
          push: false
          tags: edtech-musical-admin:ci
